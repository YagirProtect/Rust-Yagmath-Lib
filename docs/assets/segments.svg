<svg xmlns="http://www.w3.org/2000/svg" width="900" height="245" viewBox="0 0 900 245" role="img" aria-labelledby="title desc">
  <title id="title">Closed 2D segment intersections</title>
  <desc id="desc">Crossing segments and endpoint touches return a point. Collinear segments can share a complete interval, returned as an overlap.</desc>
