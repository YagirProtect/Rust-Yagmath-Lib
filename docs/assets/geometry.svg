    <g font-size="16"><text x="413" y="249">min</text><text x="650" y="94">max</text><text x="544" y="167">center</text></g>
    <path d="M756 211L862 127L1027 162L920 246Z" fill="#e2f3ef" stroke="#16696f" stroke-width="2"/>
