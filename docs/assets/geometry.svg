    <rect x="370" y="16" width="338" height="268" rx="12" fill="white"/>
    <rect x="724" y="16" width="340" height="268" rx="12" fill="white"/>
    <g font-size="21" font-weight="bold"><text x="40" y="50">Vector2 / 3 / 4</text><text x="394" y="50">Bounds2 / 3</text><text x="748" y="50">Plane</text></g>
    <path d="M62 224H318M82 242V82" stroke="#a2b1c2" stroke-width="2"/>
