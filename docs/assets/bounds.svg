<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-labelledby="title desc">
  <title id="title">Closed bounds and closest point</title>
  <desc id="desc">A rectangle includes its boundary. A point outside the rectangle clamps to the nearest boundary. Two rectangles meeting at an edge intersect.</desc>
  <rect width="820" height="350" rx="12" fill="#f3f6fa"/>
  <g font-family="sans-serif" fill="#16324f">
    <text x="25" y="37" font-size="22" font-weight="bold">Closed bounds: min and max are included</text>
    <rect x="68" y="95" width="235" height="170" fill="#e2f3ef" stroke="#16696f" stroke-width="3"/>
    <circle cx="68" cy="265" r="5" fill="#16696f"/><circle cx="303" cy="95" r="5" fill="#16696f"/>
    <path d="M303 180H390" stroke="#d08b26" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="390" cy="180" r="6" fill="#d08b26"/><circle cx="303" cy="180" r="6" fill="#16696f"/>
    <g font-size="16"><text x="48" y="291">min=(0,0)</text><text x="244" y="80">max=(10,20)</text><text x="321" y="160">outside</text><text x="202" y="207">closest point</text><text x="87" y="327">size=(10,20), center=(5,10)</text></g>
    <rect x="479" y="114" width="136" height="140" fill="#e2f3ef" stroke="#16696f" stroke-width="3"/>
    <rect x="615" y="160" width="142" height="122" fill="#fff0d6" stroke="#d08b26" stroke-width="3"/>
    <path d="M615 160V254" stroke="#16324f" stroke-width="5"/>
    <g font-size="17"><text x="496" y="98">A</text><text x="699" y="144">B</text><text x="480" y="319">A.intersects(&amp;B) == true</text></g>
  </g>
</svg>
