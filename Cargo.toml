[package]
name = "yagmath"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Game math for Rust: generic 2D/3D/4D vectors, AABB bounds, planes, interpolation, angle helpers and numeric conversions"
readme = "README.md"
repository = "https://github.com/YagirProtect/Rust-Yagmath-Lib"
documentation = "https://github.com/YagirProtect/Rust-Yagmath-Lib/blob/master/docs/README.md"
keywords = ["math", "gamedev", "vector", "geometry", "interpolation"]
categories = ["mathematics", "game-engines"]
exclude = ["scripts/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
