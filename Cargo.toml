[package]
name = "yagmath"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Game math for Rust: generic 2D/3D/4D vectors, AABB bounds, planes, interpolation, angle helpers and numeric conversions. Optional serde and no_std support."
readme = "README.md"
repository = "https://github.com/YagirProtect/Rust-Yagmath-Lib"
documentation = "https://github.com/YagirProtect/Rust-Yagmath-Lib/blob/master/docs/README.md"
keywords = ["math", "gamedev", "vector", "geometry", "interpolation"]
categories = ["mathematics", "game-engines"]
exclude = ["scripts/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["serde?/std"]
no_std = ["libm"]
libm = ["dep:libm"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
libm = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
